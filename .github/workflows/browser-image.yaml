name: Browser Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/browser/Dockerfile'
      - 'packages/browser/.dockerignore'
      - 'packages/browser/launcher.mjs'
      - '.github/workflows/browser-image.yaml'
  pull_request:
    paths:
      - 'packages/browser/Dockerfile'
      - 'packages/browser/.dockerignore'
      - 'packages/browser/launcher.mjs'
      - '.github/workflows/browser-image.yaml'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build ARM64 browser image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: packages/browser
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/archil-data/browser:0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
