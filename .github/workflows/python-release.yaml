name: Release archil

on:
  push:
    branches:
      - main
    paths:
      - 'python/pyproject.toml'
      - '.github/workflows/python-release.yaml'

concurrency:
  group: python-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check for unreleased Python version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          if ! git ls-remote --exit-code --tags origin "refs/tags/python/v$version" >/dev/null; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release archil
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          working-directory: python

      - name: Install dependencies
        working-directory: python
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: Test
        working-directory: python
        run: uv run --no-sync pytest -q

      - name: Lint
        working-directory: python
        run: uv run --no-sync ruff check .

      - name: Type-check public API
        working-directory: python
        run: |
          uv run --no-sync mypy tests/typing_smoke.py
          uv run --no-sync pyright tests/typing_smoke.py

      - name: Build
        working-directory: python
        run: uv build

      # SBOM for the wheel about to be published: installed into an empty
      # environment, so it lists the package and the runtime dependencies it
      # resolves to. The GitHub release step attaches it.
      - name: Install wheel for SBOM
        working-directory: python
        run: |
          uv venv "$RUNNER_TEMP/sbom-env"
          uv pip install --python "$RUNNER_TEMP/sbom-env" dist/*.whl

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: archil
          SYFT_SOURCE_VERSION: ${{ needs.version.outputs.version }}
        with:
          path: ${{ runner.temp }}/sbom-env
          format: spdx-json
          artifact-name: archil-${{ needs.version.outputs.version }}.spdx.json
          output-file: ${{ runner.temp }}/archil-${{ needs.version.outputs.version }}.spdx.json
          upload-release-assets: false

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="python/v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "archil $VERSION" --generate-notes
          fi
          gh release upload "$tag" python/dist/* "$RUNNER_TEMP/archil-$VERSION.spdx.json" --clobber
