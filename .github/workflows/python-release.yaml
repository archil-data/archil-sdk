name: Release archil

on:
  push:
    tags:
      - 'python/v*'

concurrency:
  group: python-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release archil
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          working-directory: packages/python

      - name: Verify release tag
        working-directory: packages/python
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#python/v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag version $tag_version does not match pyproject.toml version $project_version."
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/python
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: Test
        working-directory: packages/python
        run: uv run --no-sync pytest -q

      - name: Lint
        working-directory: packages/python
        run: uv run --no-sync ruff check .

      - name: Type-check public API
        working-directory: packages/python
        run: |
          uv run --no-sync mypy tests/typing_smoke.py
          uv run --no-sync pyright tests/typing_smoke.py

      - name: Build
        working-directory: packages/python
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "archil ${GITHUB_REF_NAME#python/v}" \
            --generate-notes \
            packages/python/dist/*
