name: Release archil

on:
  push:
    branches:
      - main
    paths:
      - 'python/pyproject.toml'
      - '.github/workflows/python-release.yaml'

concurrency:
  group: python-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check for unreleased Python version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          if ! git ls-remote --exit-code --tags origin "refs/tags/python/v$version" >/dev/null; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: release archil
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          working-directory: python

      - name: Install dependencies
        working-directory: python
        run: |
          uv venv
          uv pip install -e '.[dev]'

      - name: Test
        working-directory: python
        run: uv run --no-sync pytest -q

      - name: Lint
        working-directory: python
        run: uv run --no-sync ruff check .

      - name: Type-check public API
        working-directory: python
        run: |
          uv run --no-sync mypy tests/typing_smoke.py
          uv run --no-sync pyright tests/typing_smoke.py

      - name: Build
        working-directory: python
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="python/v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "archil $VERSION" --generate-notes
          fi
          gh release upload "$tag" python/dist/* --clobber
