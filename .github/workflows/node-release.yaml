name: SDK Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'python/package.json'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/node-release.yaml'
      - '.github/scripts/publish-node.sh'
      - '.github/scripts/version-packages.sh'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version SDKs and publish Node packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: bash .github/scripts/version-packages.sh
          publish-script: bash .github/scripts/publish-node.sh

      - name: Deprecate @archildata/client (deprecated bridge)
        if: steps.changesets.outputs.published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          VERSION="$(
            node --input-type=module <<'NODE'
          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES ?? "[]");
          const client = packages.find((pkg) => pkg.name === "@archildata/client");
          process.stdout.write(client?.version ?? "");
          NODE
          )"

          if [ -z "$VERSION" ]; then
            echo "@archildata/client was not published; skipping deprecation."
            exit 0
          fi

          printf "//registry.npmjs.org/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          # A just-published version can take a minute to become visible to the registry API.
          for attempt in $(seq 1 20); do
            pnpm deprecate "@archildata/client@${VERSION}" \
              "Renamed — install 'disk' for the pure-JS API/CLI and '@archildata/native' for the FUSE binding." && exit 0
            sleep 15
          done
          exit 1
