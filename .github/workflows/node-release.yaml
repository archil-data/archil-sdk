name: SDK Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'python/package.json'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/node-release.yaml'
      - '.github/scripts/publish-node.sh'
      - '.github/scripts/version-packages.sh'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version SDKs and publish Node packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: bash .github/scripts/version-packages.sh
          publish-script: bash .github/scripts/publish-node.sh
