name: Eve E2E

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/eve-e2e.yaml'
  workflow_dispatch:

jobs:
  eval:
    name: Archil Eve eval
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
      ARCHIL_REGION: ${{ vars.ARCHIL_REGION }}
      ARCHIL_BASE_URL: ${{ vars.ARCHIL_BASE_URL }}
      ARCHIL_S3_BASE_URL: ${{ vars.ARCHIL_S3_BASE_URL }}
      ARCHIL_E2E_ROOT_PREFIX: archil-e2e/github/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Create test disk
        id: create-disk
        run: |
          created="$(pnpm --filter disk exec disk --base-url "$ARCHIL_BASE_URL" create "eve-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          disk_id="$(sed -n 's/^  id:     //p' <<< "$created")"
          echo "disk-id=$disk_id" >> "$GITHUB_OUTPUT"

          for _ in {1..60}; do
            status="$(pnpm --filter disk exec disk --base-url "$ARCHIL_BASE_URL" get "$disk_id" -o json | jq -r .status)"
            if [[ "$status" == "available" ]]; then
              exit 0
            fi
            sleep 1
          done

          echo "Timed out waiting for disk $disk_id to become available"
          exit 1

      - name: Run Archil Eve eval
        env:
          ARCHIL_E2E_DISK_ID: ${{ steps.create-disk.outputs.disk-id }}
        run: pnpm --filter @archildata/eve-e2e eval

      - name: Delete test disk
        if: always() && steps.create-disk.outputs.disk-id != ''
        run: pnpm --filter disk exec disk --base-url "$ARCHIL_BASE_URL" delete "${{ steps.create-disk.outputs.disk-id }}"
