name: Eve E2E

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/eve-e2e.yaml'
  workflow_dispatch:

jobs:
  eval:
    name: Archil Eve eval
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
      ARCHIL_REGION: ${{ vars.ARCHIL_REGION }}
      ARCHIL_BASE_URL: ${{ vars.ARCHIL_BASE_URL }}
      ARCHIL_S3_BASE_URL: ${{ vars.ARCHIL_S3_BASE_URL }}
      ARCHIL_E2E_ROOT_PREFIX: archil-e2e/github/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run Archil Eve eval
        run: pnpm --filter @archildata/eve-e2e eval
