[project]
name = "archil"
version = "0.8.27"
description = "Pure-Python client for Archil disks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["archil", "disk", "filesystem", "s3"]
authors = [{ name = "Archil, Inc.", email = "support@archil.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "archil-openapi>=0.0.2,<0.0.3",
    "httpx>=0.27",
    "synchronicity>=0.12.3",
]

[project.urls]
Homepage = "https://archil.com"
Documentation = "https://docs.archil.com"

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.0.1"]
langchain = ["langchain-core>=0.3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
    "synchronicity[compile]>=0.12.3",
    "mypy>=1.11",
    "pyright>=1.1.390",
    "openai-agents>=0.0.1",
    "openai<2.45",
    "langchain-core>=0.3",
]

[tool.uv.build-backend]
module-name = "archil"
module-root = ""
data = [
    "CHANGELOG.md",
    "LICENSE",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
